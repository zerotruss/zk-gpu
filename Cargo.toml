[package]
name = "zk-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Portable GPU MSM and NTT for BN254 (wgpu / WGSL, native + WebGPU)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zerotruss/zk-gpu"
readme = "README.md"
keywords = ["zk", "gpu", "msm", "ntt", "webgpu"]
categories = ["cryptography", "mathematics"]
exclude = ["tools", "bench", "deny.toml", "rustfmt.toml"]

[dependencies]
wgpu = "28"
pollster = "1.0"
bytemuck = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-std = "0.6"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ark-ec = { version = "0.6", features = ["parallel"] }
ark-poly = { version = "0.6", features = ["parallel"] }
rayon = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
ark-ec = "0.6"
ark-poly = "0.6"
wasm-bindgen-test = "0.3"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
