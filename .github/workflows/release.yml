# Release: runs only when a version tag such as v0.1.0 is pushed.
#
#   verify  -> checks the tag, the code and the dependencies
#   build   -> crate package, SBOM (CycloneDX), checksums
#   attest  -> signed build provenance for those files
#   release -> a DRAFT GitHub Release with the files; a person reviews and publishes it
#   publish -> crates.io, only after a person approves the "crates-io" environment
#
# GPU tests cannot run here (hosted runners have no GPU): run ./check.sh full and ./check.sh browser
# on a real machine before pushing the tag.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag and the code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag matches Cargo.toml and points at a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main" >&2; exit 1; }
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - name: Format, lint, documentation
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --release
      - name: Tests that need no GPU, wasm build
        run: |
          cargo test --release --example compare
          cargo build --release --target wasm32-unknown-unknown --lib
          python3 tools/mutation_check.py --stale
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build:
    name: Crate package, SBOM, checksums
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Package the crate
        run: cargo package --locked
      - name: Software Bill of Materials (CycloneDX 1.5, JSON, all targets)
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.9
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          cargo cyclonedx --format json --target all --spec-version 1.5 --override-filename zk-gpu.cdx
      - name: Collect the files and write checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp target/package/*.crate dist/
          cp zk-gpu.cdx.json "dist/zk-gpu-${TAG}.cdx.json"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  attest:
    name: Build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the repository
      id-token: write # sign the attestation with this workflow's identity
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.crate
            dist/*.cdx.json

  release:
    name: Draft GitHub Release
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$TAG" $prerelease

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needs a person's approval: set "Required reviewers" on this environment in the repository settings.
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
